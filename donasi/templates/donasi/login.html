{% extends 'donasi/base.html' %}
{% block title %}Masuk — MBG{% endblock %}
{% block content %}<section class="donation-form-shell donation-content"><h1 class="donation-heading">MASUK KE <span>MBG</span></h1><p class="donation-intro">Masuk untuk mengelola donasi atau melihat informasi donor.</p><form method="post" class="donation-panel donation-form donation-login">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">{% if form.errors %}<p class="donation-form-errors" role="alert">Nama pengguna atau kata sandi tidak sesuai.</p>{% endif %}<div class="mb-4"><label for="id_username">Nama pengguna</label><input class="form-control" id="id_username" name="username" autocomplete="username" value="{{ form.username.value|default:'' }}" required autofocus></div><div class="mb-4"><label for="id_password">Kata sandi</label><input class="form-control" type="password" id="id_password" name="password" autocomplete="current-password" required></div><button class="btn btn-mbg-green w-100" type="submit">Masuk</button></form></section>{% endblock %}
