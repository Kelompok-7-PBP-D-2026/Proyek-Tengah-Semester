{% extends "base.html" %}

{% block title %}Masuk — MBG{% endblock %}

{% block content %}
<section class="container py-5" style="max-width: 26rem;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="font-display h4 text-forest mb-3">Masuk</h1>
            {% if form.errors %}
            <div class="alert alert-danger py-2 small">Username atau kata sandi salah.</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="mb-3">
                    <label class="form-label small fw-semibold" for="{{ form.username.id_for_label }}">Username</label>
                    <input type="text" name="username" id="{{ form.username.id_for_label }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold" for="{{ form.password.id_for_label }}">Kata sandi</label>
                    <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control" required>
                </div>
                <button class="btn btn-mbg-green w-100" type="submit">Masuk</button>
            </form>
            <p class="small text-muted mt-3 mb-0">Belum punya akun? <a class="text-forest fw-semibold" href="{% url 'profil:daftar' %}">Daftar</a></p>
        </div>
    </div>
</section>
{% endblock %}
