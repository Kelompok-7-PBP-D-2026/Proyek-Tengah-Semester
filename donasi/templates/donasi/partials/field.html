<div class="donation-field {% if field.errors %}has-error{% endif %} {% if wide %}field-wide{% endif %}" data-field="{{ field.name }}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% if field.name == 'foto' %}
    {% if item.foto %}<p class="small"><a href="{% url 'donasi:foto' item.pk %}" target="_blank" rel="noopener">Lihat foto saat ini</a></p>{% endif %}
    <input type="file" name="foto" accept="image/jpeg,image/png" class="form-control" id="id_foto" aria-describedby="id_foto_help id_foto_errors" {% if field.errors %}aria-invalid="true"{% endif %}>
    {% if item.foto %}<label class="photo-clear"><input type="checkbox" name="foto-clear" id="foto-clear_id"> Hapus foto saat ini</label>{% endif %}
  {% else %}{{ field }}{% endif %}
  <p class="form-text" id="id_{{ field.name }}_help">{{ field.help_text }}</p>
  {% if field.name == 'lokasi' %}<a class="small" href="{% url 'venue:daftar' %}">Lihat daftar venue dan peta</a>{% endif %}
  <div class="donation-field-errors" id="id_{{ field.name }}_errors">{% for error in field.errors %}<p>{{ error }}</p>{% endfor %}</div>
</div>
