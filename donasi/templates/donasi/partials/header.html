{% load static %}
<nav class="navbar navbar-expand-md donation-nav" aria-label="Navigasi utama">
  <div class="container donation-nav-inner">
    <a class="navbar-brand donation-brand" href="{% url 'profil:home' %}"><img src="{% static 'donasi/images/truck.svg' %}" width="32" height="24" alt=""> MBG</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#donation-nav" aria-controls="donation-nav" aria-expanded="false" aria-label="Buka navigasi"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse justify-content-end" id="donation-nav">
      <ul class="navbar-nav align-items-md-center gap-2">
        <li class="nav-item"><a class="nav-link donation-nav-link {% if not filters.mine %}active{% endif %}" href="{% url 'donasi:daftar' %}">Cari makanan</a></li>
        {% if is_donor %}<li class="nav-item"><a class="nav-link donation-nav-link {% if filters.mine %}active{% endif %}" href="{% url 'donasi:daftar' %}?mine=1">Donasi saya</a></li>{% endif %}
        {% if user.is_authenticated %}
        <li class="nav-item"><span class="donation-role">{% if is_donor %}Donor{% else %}Penerima{% endif %}</span></li>
        <li class="nav-item"><span class="donation-avatar" title="{{ user.get_username }}">{{ user.get_username|slice:':2'|upper }}</span></li>
        <li class="nav-item"><form method="post" action="{% url 'donasi:logout' %}">{% csrf_token %}<button class="btn btn-sm donation-logout" type="submit">Keluar</button></form></li>
        {% else %}<li class="nav-item"><a class="btn btn-mbg-green" href="{% url 'donasi:login' %}">Masuk</a></li>{% endif %}
      </ul>
    </div>
  </div>
</nav>
